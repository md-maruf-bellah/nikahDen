# CI — প্রতিটি push-এ চলে:
#   ১) backend: পূর্ণ টেস্ট স্যুট (node --test, in-memory MongoDB — আলাদা Mongo service লাগে না)
#   ২) frontend: ইউনিট টেস্ট (node --test — ফ্রন্টএন্ড লজিক React-মুক্ত মডিউলে) + next build
#
# নোট: runner (ubuntu-24.04) এ mongodb-memory-server-এর পুরনো default mongod
# libcrypto.so.1.1 খুঁজে ব্যর্থ হয় — তাই MONGOMS_VERSION দিয়ে 7.0.x পিন করা
# (OpenSSL 3 লিংকড, 24.04-এ চলে)। 7.0.24 হলো এই স্যুটে লোকালি প্রমাণিত সংস্করণ।
# রেফ: typegoose/mongodb-memory-server#908
name: CI

on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    strategy:
      fail-fast: false
      matrix:
        # Node 20 LTS + 22 — backend engines >=20 (nodemailer@10 এর ন্যূনতম);
        # --test-concurrency ফ্ল্যাগ v20.10 থেকে আছে, আর runner-এ "20" মানে latest v20.x
        node: ["20", "22"]
    env:
      MONGOMS_VERSION: "7.0.24"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # নিরাপত্তা — high/critical CVE থাকলে CI লাল (npm audit fix দিয়ে ঠিক করুন)
      - name: Audit dependencies (npm audit)
        run: npm audit --audit-level=high

      - name: Run test suite
        run: npm test

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # production-tree audit — dev-চেইনের braces (eslint-config-next → fast-glob)
      # এখনো patched নয় (upstream রিলিজ অপেক্ষমান), তাই সেটি বিল্ড-গেট করে না
      - name: Audit production dependencies (npm audit)
        run: npm audit --omit=dev --audit-level=high

      - name: Unit tests (node --test)
        run: npm test

      - name: Build (next build)
        run: npm run build
